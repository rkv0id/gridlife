<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gridlife</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>gridlife</h1>
            <div class="controls-top">
                <button id="btn-play">Play</button>
                <button id="btn-pause" disabled>Pause</button>
                <button id="btn-reset">Reset</button>
            </div>
        </header>
        <div class="main">
            <div class="canvas-wrap">
                <canvas id="canvas"></canvas>
            </div>
            <aside class="sidebar">
                <section>
                    <label>Simulation</label>
                    <select id="sim-select"></select>
                </section>
                <section id="presets-section" style="display: none;">
                    <label>Preset</label>
                    <select id="preset-select"></select>
                </section>
                <section id="params-section">
                    <label>Parameters</label>
                    <div id="params-container"></div>
                </section>
                <section>
                    <label>Workers</label>
                    <div class="worker-control">
                        <input type="range" id="worker-slider" min="1" max="16" value="4">
                        <span id="worker-count">4</span>
                    </div>
                </section>
                <section>
                    <label>Performance</label>
                    <div class="metrics">
                        <div>step: <span id="m-step">0</span>ms</div>
                        <div>halo: <span id="m-halo">0</span>ms</div>
                        <div>steps: <span id="m-steps">0</span></div>
                    </div>
                </section>
                <section>
                    <label>Chaos</label>
                    <div style="display: flex; flex-direction: column; gap: 6px;">
                        <button id="btn-kill">Kill Random Worker</button>
                        <button id="btn-heal">Heal Worker</button>
                        <button id="btn-chaos">Auto-Chaos: OFF</button>
                    </div>
                </section>
            </aside>
        </div>
        <footer>
            <span id="status-bar" class="status-left">connecting...</span>
            <span id="status-info" class="status-right"></span>
        </footer>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
