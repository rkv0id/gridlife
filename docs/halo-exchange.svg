<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: system-ui, -apple-system, sans-serif; }
  .th { font-size: 14px; font-weight: 500; fill: #3d3d3a; }
  .ts { font-size: 12px; fill: #73726c; }
  .box-blue { fill: #E6F1FB; stroke: #185FA5; stroke-width: 0.5; }
  .box-teal { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
  .box-coral { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.5; }
  .t-blue { fill: #0C447C; }
  .t-teal { fill: #085041; }
  .t-coral { fill: #712B13; }
  .ts-blue { fill: #185FA5; }
  @media (prefers-color-scheme: dark) {
    .th { fill: #e0e0e0; }
    .ts { fill: #9c9a92; }
    .box-blue { fill: #0C447C; stroke: #85B7EB; }
    .box-teal { fill: #085041; stroke: #5DCAA5; }
    .box-coral { fill: #712B13; stroke: #F0997B; }
    .t-blue, .ts-blue { fill: #B5D4F4; }
    .t-teal { fill: #9FE1CB; }
    .t-coral { fill: #F5C4B3; }
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect class="box-blue" x="140" y="30" width="400" height="24" rx="4" opacity="0.6"/>
<text class="ts ts-blue" x="340" y="46" text-anchor="middle" dominant-baseline="central">Halo from worker above (read-only)</text>

<rect class="box-teal" x="140" y="58" width="400" height="80" rx="0"/>
<text class="th t-teal" x="340" y="98" text-anchor="middle" dominant-baseline="central">Worker 0 owned rows</text>

<rect class="box-blue" x="140" y="142" width="400" height="24" rx="4" opacity="0.6"/>
<text class="ts ts-blue" x="340" y="158" text-anchor="middle" dominant-baseline="central">Halo from worker below (read-only)</text>

<text class="th" x="68" y="98" text-anchor="middle">Worker 0</text>

<rect x="140" y="170" width="400" height="8" rx="2" fill="#73726c" opacity="0.2"/>

<rect class="box-blue" x="140" y="182" width="400" height="24" rx="4" opacity="0.6"/>
<text class="ts ts-blue" x="340" y="198" text-anchor="middle" dominant-baseline="central">Halo from worker above (read-only)</text>

<rect class="box-coral" x="140" y="210" width="400" height="80" rx="0"/>
<text class="th t-coral" x="340" y="250" text-anchor="middle" dominant-baseline="central">Worker 1 owned rows</text>

<rect class="box-blue" x="140" y="294" width="400" height="24" rx="4" opacity="0.6"/>
<text class="ts ts-blue" x="340" y="310" text-anchor="middle" dominant-baseline="central">Halo from worker below (read-only)</text>

<text class="th" x="68" y="250" text-anchor="middle">Worker 1</text>

<line x1="555" y1="128" x2="555" y2="188" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="615" y="155" text-anchor="middle">Bottom rows</text>

<line x1="565" y1="218" x2="565" y2="156" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="625" y="190" text-anchor="middle">Top rows</text>

<text class="ts" x="340" y="355" text-anchor="middle">Each worker sends its boundary rows to neighbors before stepping.</text>
<text class="ts" x="340" y="375" text-anchor="middle">Toroidal topology: last worker wraps to first worker.</text>
</svg>