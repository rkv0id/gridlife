[project]
name = "gridlife"
version = "0.1.0"
description = "Distributed grid simulation engine built on Ray"
requires-python = ">=3.12"
dependencies = [
    "ray[default]>=2.54",
    "torch>=2.6",
    "numpy>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "typer>=0.15",
    "pydantic>=2.10",
    "Pillow>=11.0",
]

[project.scripts]
gridlife = "gridlife.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportAttributeAccessIssue = false
ignore = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "ruff>=0.11",
    "pyright>=1.1",
]
